version: "3.8"

services:
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: om-search-opensearch
    environment:
      - cluster.name=om-search-cluster
      - node.name=om-node-1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: om-search-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-om_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-om_password}
      POSTGRES_DB: ${POSTGRES_DB:-om_search}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-om_user} -d ${POSTGRES_DB:-om_search}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: om-search-backend
    environment:
      - ENVIRONMENT=production
      - OPENSEARCH_HOST=opensearch
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USE_SSL=false
      - DATABASE_URL=postgresql://${POSTGRES_USER:-om_user}:${POSTGRES_PASSWORD:-om_password}@postgres:5432/${POSTGRES_DB:-om_search}
      - HOST=0.0.0.0
      - PORT=8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      opensearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: om-search-frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  opensearch-data:
    driver: local
  postgres-data:
    driver: local
