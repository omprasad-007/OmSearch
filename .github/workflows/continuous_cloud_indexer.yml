name: Cloud Continuous Google Drive Indexer

on:
  schedule:
    # Runs automatically every 4 hours in the cloud (even when laptop is off)
    - cron: '0 */4 * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

jobs:
  cloud-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Ingestion Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt google-auth-httplib2

      - name: Run Cloud Archiving to Google Drive (Zero Disk Footprint)
        env:
          PYTHONPATH: .
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
          OPERATOR_API_KEY: ${{ secrets.OPERATOR_API_KEY }}
        run: |
          mkdir -p data data/temp_drive_spool
          python scripts/run_continuous_drive_ingestion.py --batch-size 5000 --max-batches 20 --crawl-threads 8
