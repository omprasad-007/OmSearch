services:
  - type: web
    name: omsearch
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: OPERATOR_API_KEY
        value: "om-operator-secret-key-2026"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: "https://omsearch.onrender.com/api/v1/storage/google-drive/callback"
      - key: GOOGLE_DRIVE_ROOT_FOLDER_NAME
        value: "OM-Search-Data"
      - key: GOOGLE_DRIVE_ROOT_FOLDER_ID
        value: "1HSmEYSlw57hQkW4FBLft_-11e6sR72Qk"
      - key: GOOGLE_DRIVE_STORAGE_BUDGET_BYTES
        value: "5497558138880"
      - key: GOOGLE_DRIVE_ENABLED
        value: "true"
      - key: GOOGLE_DRIVE_TEMP_DIR
        value: "/tmp/drive_spool"
      - key: USE_SQLITE_FALLBACK_IF_UNAVAILABLE
        value: "true"
      - key: SQLITE_FALLBACK_URL
        value: "sqlite:///./om_search_local.db"
      - key: OPENSEARCH_HOST
        value: "127.0.0.1"
      - key: OPENSEARCH_PORT
        value: "9200"
