[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "om-search-backend"
version = "0.1.0"
description = "OM Search Engine - Core Backend and Search API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "opensearch-py>=2.7.1",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
    "httpx>=0.27.2",
    "beautifulsoup4>=4.12.3",
    "python-dotenv>=1.0.1",
    "scrapy>=2.12.0",
    "trafilatura>=2.0.0",
    "alembic>=1.14.0",
    "google-api-python-client>=2.200.0",
    "google-auth>=2.60.0",
    "google-auth-oauthlib>=1.5.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".", ".."]
asyncio_mode = "auto"
